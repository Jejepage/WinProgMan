name: Windows test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm run desktop:build -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: PlanB-windows-x64
          path: src-tauri/target/windows/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
